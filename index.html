<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; padding:0; min-height:100%; width:100%; max-width:100%; overflow-x:hidden; }
  /* Pozadie maľuje HTML, nie body — pokryje aj hornú/dolnú safe-area a overscroll,
     takže dole nezostáva žiadny pás. */
  html {
    background-color:#161616;
    background-image:
      radial-gradient(60% 32% at 100% 0%, rgba(0,121,152,0.16), transparent 65%),
      radial-gradient(48% 26% at 0% 92%, rgba(184,247,255,0.05), transparent 65%),
      linear-gradient(170deg, #232323 0%, #161616 70%, #0E0E0E 100%);
    background-attachment: fixed;
    background-repeat: no-repeat;
    background-size: cover;
  }
  body { background:transparent; min-height:100vh; }
  #root { min-height:100%; }
  .scrollpane { min-height:100%; overflow:visible; -webkit-overflow-scrolling:touch; }
  ::-webkit-scrollbar { width:0; height:0; }
  @keyframes riseIn { from { transform:translateY(14px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  @keyframes slideUp { from { transform:translateY(32px); opacity:0; } to { transform:translateY(0); opacity:1; } }
  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes barGrow { from { transform:scaleX(0); } to { transform:scaleX(1); } }
  .rise { opacity:0; animation:riseIn 420ms cubic-bezier(.2,.8,.2,1) forwards; animation-delay:calc(var(--i,0)*50ms); }
  .slide-anim { animation:slideUp 260ms cubic-bezier(.2,.8,.2,1); }
  .fade-anim { animation:fadeIn 200ms ease; }
  .bar-grow { transform-origin:left center; animation:barGrow 700ms cubic-bezier(.2,.8,.2,1) forwards; transform:scaleX(0); }
  .jchip { transition:transform 120ms ease, background 150ms ease, color 150ms ease, border-color 150ms ease; }
  .jchip:active { transform:scale(0.94); }
  .jpress { transition:transform 110ms ease, opacity 140ms ease; }
  .jpress:active { transform:scale(0.97); }
  .jfocus:focus { border-color:rgba(0,121,152,0.65) !important; box-shadow:0 0 0 3px rgba(0,121,152,0.16); }
  /* riadok tabuľky — podsvietenie pri prechode kurzorom */
  .trow { transition: background-color 160ms ease, box-shadow 200ms ease, transform 160ms ease; position:relative; }
  .trow::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
    background:linear-gradient(180deg,#B8F7FF,#007998); opacity:0; transform:scaleY(.3);
    transition:opacity 180ms ease, transform 220ms cubic-bezier(.2,.8,.2,1); }
  .trow:hover { background-color:rgba(184,247,255,0.07) !important; box-shadow:inset 0 0 0 1px rgba(184,247,255,0.16); }
  .trow:hover::before { opacity:1; transform:scaleY(1); }
  .trow:active { transform:scale(0.995); }
  .thead { position:sticky; top:0; z-index:5; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    background:rgba(20,20,20,0.94); box-shadow:0 8px 18px rgba(0,0,0,0.5); }
  .icobtn { transition: transform 140ms cubic-bezier(.2,.8,.2,1), color 160ms ease, opacity 160ms ease, background 160ms ease; }
  .icobtn:not(:disabled):hover { transform:translateY(-1px); color:#B8F7FF; }
  .icobtn:not(:disabled):active { transform:scale(0.88); }
  @keyframes flashRow { 0%{background-color:rgba(184,247,255,0.26);} 100%{background-color:transparent;} }
  .flash { animation:flashRow 950ms ease-out; }
  @keyframes popIn { 0%{opacity:0;transform:scale(.92);} 100%{opacity:1;transform:scale(1);} }
  .popin { animation:popIn 220ms cubic-bezier(.2,.8,.2,1) both; }
  @keyframes toastIn { from{opacity:0;transform:translate(-50%,14px);} to{opacity:1;transform:translate(-50%,0);} }
  .toast { animation:toastIn 260ms cubic-bezier(.2,.8,.2,1) both; }
  @media (prefers-reduced-motion: reduce) {
    .jchip,.jpress { transition:none !important; }
    .rise,.slide-anim,.fade-anim,.bar-grow { animation:none !important; opacity:1 !important; transform:none !important; }
  }
  input,textarea,button { font:inherit; }
  button { cursor:pointer; border:none; background:none; }
  input[type="date"] { -webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; width:100%; text-align:left; font-size:17px; min-height:50px; }
  input[type="date"]::-webkit-date-and-time-value { text-align:left; margin:0; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter:invert(0.8); opacity:0.5; }
</style>

const pad2 = (n) => String(n).padStart(2,"0");
const localISO = (d) => `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`;
const todayISO = () => localISO(new Date());
const mondayOf = (iso) => { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return localISO(d); };
const addDays = (iso, n) => { const d = new Date(iso+"T00:00:00"); d.setDate(d.getDate()+n); return localISO(d); };
const isoWeekNum = (iso) => {
  const d = new Date(iso+"T00:00:00");
  d.setDate(d.getDate() + 3 - ((d.getDay()+6)%7));
  const w1 = new Date(d.getFullYear(),0,4);
  return 1 + Math.round(((d - w1)/86400000 - 3 + ((w1.getDay()+6)%7))/7);
};
const shortD = (iso) => { const [,m,dd] = iso.split("-"); return `${parseInt(dd)}.${parseInt(m)}.`; };
const fullD = (iso) => { const [y,m,dd] = iso.split("-"); return `${parseInt(dd)}.${parseInt(m)}.${y}`; };
const DAYS_SK = ["Pondelok","Utorok","Streda","Štvrtok","Piatok","Sobota","Nedeľa"];
const dayName = (iso) => DAYS_SK[(new Date(iso+"T00:00:00").getDay()+6)%7];

/* ---------- čísla ---------- */
const fmt$ = (n, sign=false) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const s = Math.abs(n).toLocaleString("sk-SK",{minimumFractionDigits:2, maximumFractionDigits:2});
  return (n<0?"−":sign&&n>0?"+":"") + s + " $";
};
const fmtPct = (n, dec=2, sign=true) => {
  if (n === null || n === undefined || isNaN(n)) return "—";
  const s = Math.abs(n*100).toLocaleString("sk-SK",{minimumFractionDigits:dec, maximumFractionDigits:dec});
  return (n<0?"−":sign&&n>0?"+":"") + s + " %";
};
const fmtRR = (n) => n==null ? "" : n.toLocaleString("sk-SK",{maximumFractionDigits:2});
/* RR sa dopočítava: zisk / risk(SL). Píše sa len pri ziskových obchodoch.
   Staršie importované obchody bez SL si ponechajú pôvodne zapísané RR. */
const rrOf = (t) => {
  if (t.sl != null && t.sl > 0 && t.pnl != null) return t.pnl > 0 ? Math.round((t.pnl / t.sl) * 100) / 100 : null;
  return t.rr;
};
const num = (s) => { const v = parseFloat(String(s??"").replace(/\s/g,"").replace(",",".")); return isNaN(v)?null:v; };
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,6);

  return emptyState();
};

/* ---------- výpočty ---------- */
const weekStartBalance = (state, monday) => {
  if (state.balances[monday] != null) return { val: state.balances[monday], explicit: true };
  const known = Object.keys(state.balances).filter(k => k < monday).sort();
  let baseDate = null, base = state.start;
  if (known.length) { baseDate = known[known.length-1]; base = state.balances[baseDate]; }
  const from = baseDate || "0000-00-00";
  const pnl = state.trades
    .filter(t => t.date >= from && t.date < monday && t.pnl != null)
    .reduce((a,t) => a + t.pnl, 0);
  return { val: base + pnl, explicit: false };
};

const weekStats = (state, monday) => {
  const sunday = addDays(monday, 6);
  const trades = state.trades.filter(t => t.date >= monday && t.date <= sunday)
    .sort((a,b) => a.date === b.date ? (a.id > b.id ? 1 : -1) : (a.date > b.date ? 1 : -1));
  /* prázdne Spustené sa ráta ako 0 */
  const decided = trades;
  const fired = trades.filter(t => t.spustene === 1);
  const closed = fired.filter(t => t.vysledok === 1 || t.vysledok === 0);
  const wins = closed.filter(t => t.vysledok === 1);
  const rrs = trades.map(rrOf).filter(v => v != null);
  const sum = trades.reduce((a,t) => a + (t.pnl ?? 0), 0);
  const sb = weekStartBalance(state, monday);
  return {
    trades, monday, sunday,
    startBal: sb.val, explicit: sb.explicit,
    endBal: sb.val + sum, sum,
    weekPct: sb.val ? sum / sb.val : null,
    firedPct: decided.length ? fired.length / decided.length : null,
    winRate: closed.length ? wins.length / closed.length : null,
    avgRR: rrs.length ? rrs.reduce((a,b)=>a+b,0)/rrs.length : null,
    nFired: fired.length, nDecided: decided.length, nWins: wins.length, nClosed: closed.length,
    fromStartPct: state.start ? (sb.val + sum - state.start) / state.start : null,
  };
};

const totalStats = (state) => {
  const all = state.trades;
  /* prázdne Spustené sa ráta ako 0 */
  const decided = all;
  const fired = all.filter(t => t.spustene === 1);
  const closed = fired.filter(t => t.vysledok === 1 || t.vysledok === 0);
  const wins = closed.filter(t => t.vysledok === 1);
  const rrs = all.map(rrOf).filter(v => v != null);
  const sum = all.reduce((a,t) => a + (t.pnl ?? 0), 0);
  const mondays = [...new Set(all.map(t => mondayOf(t.date)).concat(Object.keys(state.balances)))].sort();
  let curBal = state.start;
  if (mondays.length) { const ws = weekStats(state, mondays[mondays.length-1]); curBal = ws.endBal; }
  const equity = mondays.map(m => { const ws = weekStats(state, m); return { m, end: ws.endBal, sum: ws.sum }; });
  return {
    n: all.length, nFired: fired.length, nDecided: decided.length, nClosed: closed.length, nWins: wins.length,
    firedPct: decided.length ? fired.length/decided.length : null,
    winRate: closed.length ? wins.length/closed.length : null,
    avgRR: rrs.length ? rrs.reduce((a,b)=>a+b,0)/rrs.length : null,
    sum, curBal,
    fromStart: state.start ? (curBal - state.start)/state.start : null,
    equity, weeks: mondays.length,
  };
};

/* ---------- CSV ---------- */
const CSV_HEADER = "Typ;Datum;Nastroj;Spustene;Vysledok;Pozn;RR;Zisk_Strata;SL";
const buildCSV = (state) => {
  const esc = (v) => { const s = String(v ?? ""); return /[;"\n]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const lines = [CSV_HEADER];
  lines.push(["START","","","","","zaciatok uctu","",state.start].map(esc).join(";"));
  for (const m of Object.keys(state.balances).sort())
    lines.push(["BALANCE",m,"","","","","",state.balances[m].toFixed(2)].map(esc).join(";"));
  const trades = [...state.trades].sort((a,b) => a.date > b.date ? 1 : a.date < b.date ? -1 : 0);
  for (const t of trades)
    lines.push(["TRADE",t.date,t.pair,
      t.spustene==null?"":t.spustene, t.vysledok==null?"":t.vysledok,
      t.pozn||"", rrOf(t)==null?"":String(rrOf(t)).replace(".",","),
      t.pnl==null?"":t.pnl.toFixed(2),
      t.sl==null?"":t.sl.toFixed(2)].map(esc).join(";"));
  return lines.join("\n");
};
const parseCSVLine = (line) => {
  const out = []; let cur = "", inQ = false;
  for (let i=0;i<line.length;i++){ const c=line[i];
    if (inQ){ if (c==='"'){ if (line[i+1]==='"'){cur+='"';i++;} else inQ=false; } else cur+=c; }
    else { if (c==='"') inQ=true; else if (c===';'){ out.push(cur); cur=""; } else cur+=c; } }
  out.push(cur); return out;
};
const importCSV = (text, state) => {
  const lines = text.split(/\r?\n/).filter(l => l.trim());
  let start = state.start; const balances = {...state.balances}; const newTrades = [];
  let added=0, dup=0;
  const key = (t) => `${t.date}|${t.pair}|${t.rr}|${t.pnl}|${t.pozn}|${t.sl}`;
  const existing = new Set(state.trades.map(key));
  for (const line of lines) {
    const c = parseCSVLine(line);
    const typ = (c[0]||"").trim().toUpperCase();
    if (typ === "START") { const v = num(c[7]); if (v != null) start = v; continue; }
    if (typ === "BALANCE") { const d = (c[1]||"").trim(); const v = num(c[7]);
      if (/^\d{4}-\d{2}-\d{2}$/.test(d) && v != null) balances[mondayOf(d)] = v; continue; }
    if (typ !== "TRADE") continue;
    const d = (c[1]||"").trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) continue;
    const t = { id: uid(), date: d, pair: (c[2]||"").trim(),
      spustene: c[3]==null||c[3].trim()==="" ? null : (num(c[3])===1?1:0),
      vysledok: c[4]==null||c[4].trim()==="" ? null : (num(c[4])===1?1:0),
      pozn: (c[5]||"").trim(), rr: num(c[6]), pnl: num(c[7]), sl: num(c[8]) };
    if (existing.has(key(t))) { dup++; continue; }
    existing.add(key(t)); newTrades.push(t); added++;
  }
  return { next: { start, balances, trades: [...state.trades, ...newTrades] }, added, dup };
};

const EquityChart = ({ equity, start }) => {
  const [hover, setHover] = useState(null);
  const svgRef = useRef(null);
  if (!equity || equity.length < 2) return <div style={{ color:P.faint, fontSize:15, fontFamily:SANS }}>Potrebné aspoň 2 týždne dát.</div>;
  const W = 960, H = 300, padL = 12, padR = 26, padT = 40, padB = 34;
  const ys = equity.map(e => e.end);
  const minY = Math.min(start, ...ys), maxY = Math.max(start, ...ys);
  const span = (maxY - minY) || 1;
  const X = (i) => padL + (i/(equity.length-1))*(W-padL-padR);
  const Y = (v) => H - padB - ((v-minY)/span)*(H-padT-padB);
  const line = equity.map((e,i)=>`${X(i)},${Y(e.end)}`).join(" ");
  const last = equity[equity.length-1];
  const up = last.end >= start;
  const n = equity.length;
  const labelStep = n <= 14 ? 1 : Math.ceil(n/14);
  /* týždenná zmena v % zo začiatku daného týždňa */
  const wkPct = equity.map(e => { const sb = e.end - e.sum; return sb ? e.sum/sb : 0; });
  const showPctLabels = n <= 18;

  const onMove = (e) => {
    const svg = svgRef.current; if (!svg) return;
    const r = svg.getBoundingClientRect();
    const cx = ((e.touches ? e.touches[0].clientX : e.clientX) - r.left) / r.width * W;
    let best = 0, bd = Infinity;
    for (let i=0;i<n;i++){ const d = Math.abs(X(i)-cx); if (d<bd){bd=d;best=i;} }
    setHover(best);
  };

  const h = hover != null ? equity[hover] : null;
  const tipW = 168, tipH = 78;
  const tipX = h ? Math.min(Math.max(X(hover)-tipW/2, 4), W-tipW-4) : 0;
  const tipY = h ? (Y(h.end) < padT + tipH + 16 ? Y(h.end) + 18 : Y(h.end) - tipH - 14) : 0;

  return (
    <svg ref={svgRef} viewBox={`0 0 ${W} ${H}`} style={{ width:"100%", height:"auto", display:"block", touchAction:"pan-y" }}
      onMouseMove={onMove} onMouseLeave={()=>setHover(null)} onTouchStart={onMove} onTouchMove={onMove} onTouchEnd={()=>setTimeout(()=>setHover(null),1600)}>
      <defs>
        <linearGradient id="eqF" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stopColor={up?P.win:P.loss} stopOpacity="0.22" />
          <stop offset="1" stopColor={up?P.win:P.loss} stopOpacity="0" />
        </linearGradient>
      </defs>
      {/* rozdeľovníky týždňov */}
      {equity.map((e,i) => (
        <line key={"g"+i} x1={X(i)} x2={X(i)} y1={padT-6} y2={H-padB} stroke="rgba(255,255,255,0.06)" strokeWidth="1" />
      ))}
      {/* nulová hladina = štart účtu */}
      <line x1={padL} x2={W-padR} y1={Y(start)} y2={Y(start)} stroke="rgba(219,219,219,0.28)" strokeWidth="1" strokeDasharray="4 5" />
      <text x={W-padR} y={Y(start)-6} textAnchor="end" fontSize="10.5" fill={P.faint} fontFamily={MONO}>štart {Math.round(start/1000)}k</text>
      {/* výplň a čiara — tenšia */}
      <polygon points={`${X(0)},${Y(start)} ${line} ${X(n-1)},${Y(start)}`} fill="url(#eqF)" />
      <polyline points={line} fill="none" stroke={up?P.win:P.loss} strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round" />
      {/* body + týždenné ± % */}
      {equity.map((e,i) => (
        <g key={"p"+i}>
          <circle cx={X(i)} cy={Y(e.end)} r={i===n-1?4:2.3} fill={i===n-1?P.ice:(e.sum>=0?P.win:P.loss)}
            style={ i===n-1 ? { filter:"drop-shadow(0 0 5px rgba(184,247,255,0.8))" } : undefined } />
          {showPctLabels && (
            <text x={X(i)} y={e.sum>=0 ? Y(e.end)-9 : Y(e.end)+16} textAnchor="middle" fontSize="10"
              fontFamily={MONO} fontWeight="700" fill={e.sum>=0?"#4FC3DF":P.loss}>
              {fmtPct(wkPct[i],1).replace(" %","")}
            </text>
          )}
          {i % labelStep === 0 && (
            <text x={X(i)} y={H-10} textAnchor="middle" fontSize="10.5" fill={P.faint} fontFamily={MONO}>KT{isoWeekNum(e.m)}</text>
          )}
        </g>
      ))}
      {/* kurzor */}
      {h && (
        <g>
          <line x1={X(hover)} x2={X(hover)} y1={padT-6} y2={H-padB} stroke="rgba(184,247,255,0.45)" strokeWidth="1" />
          <circle cx={X(hover)} cy={Y(h.end)} r="5" fill="none" stroke={P.ice} strokeWidth="1.5" />
          <g transform={`translate(${tipX},${tipY})`}>
            <rect width={tipW} height={tipH} rx="10" fill="rgba(24,24,24,0.95)" stroke="rgba(184,247,255,0.25)" />
            <text x="12" y="20" fontSize="11.5" fill={P.faint} fontFamily={SANS} fontWeight="700">Týždeň KT{isoWeekNum(h.m)} · {shortD(h.m)}–{shortD(addDays(h.m,6))}</text>
            <text x="12" y="42" fontSize="14.5" fill={P.text} fontFamily={MONO} fontWeight="800">{fmt$(h.end)}</text>
            <text x="12" y="63" fontSize="12.5" fill={h.sum>=0?"#4FC3DF":P.loss} fontFamily={MONO} fontWeight="800">{fmt$(h.sum,true)} · {fmtPct(wkPct[hover],1)}</text>
          </g>
        </g>
      )}
    </svg>
  );
};

/* ---------- hlavná appka ---------- */
const App = () => {
  const [state, setState] = useState(loadState);
  const [past, setPast] = useState([]);      // undo zásobník
  const [future, setFuture] = useState([]);  // redo zásobník
  const [saveErr, setSaveErr] = useState(false);
  const [toast, setToast] = useState("");
  const [monday, setMonday] = useState(() => mondayOf(todayISO()));
  const [wizard, setWizard] = useState(null);
  const [balEdit, setBalEdit] = useState(false);
  const [totalOpen, setTotalOpen] = useState(false);
  const [weekOpen, setWeekOpen] = useState(false);
  const [ioOpen, setIoOpen] = useState(false);
  const [dockCopied, setDockCopied] = useState(false);
  const [importMsg, setImportMsg] = useState("");
  const [copied, setCopied] = useState(false);
  const [upState, setUpState] = useState("idle");
  const [upLatest, setUpLatest] = useState("");
  const fileRef = useRef(null);
  const csvRef = useRef(null);

  const say = (m) => { setToast(m); setTimeout(()=>setToast(""), 1700); };
  /* každá zmena si odloží predchádzajúci stav — undo/redo hore v hlavičke */
  const persist = (next) => {
    setPast(p => [...p.slice(-49), state]);
    setFuture([]);
    setState(next); setSaveErr(!saveState(next));
  };
  const undo = () => {
    if (!past.length) return;
    const prev = past[past.length-1];
    setPast(p => p.slice(0,-1));
    setFuture(f => [state, ...f].slice(0,50));
    setState(prev); setSaveErr(!saveState(prev));
    say("Krok späť");
  };
  const redo = () => {
    if (!future.length) return;
    const nxt = future[0];
    setFuture(f => f.slice(1));
    setPast(p => [...p.slice(-49), state]);
    setState(nxt); setSaveErr(!saveState(nxt));
    say("Krok dopredu");
  };

  const ws = useMemo(() => weekStats(state, monday), [state, monday]);
  const tot = useMemo(() => totalStats(state), [state]);
  const kt = isoWeekNum(monday);
  const isCurrentWeek = monday === mondayOf(todayISO());
  const csvText = useMemo(() => buildCSV(state), [state]);

  /* update — tlačidlo hore, auto-kontrola pri štarte */
  const checkUpdate = async (silent) => {
    if (!silent) setUpState("checking");
    try {
      const base = location.pathname.split("?")[0];
      const res = await fetch(base + "?_=" + Date.now(), { cache:"no-store" });
      const txt = await res.text();
      const m = txt.match(/APP_VERSION\s*=\s*["']([^"']+)["']/);
      if (!m) { if (!silent) setUpState("error"); return; }
      setUpLatest(m[1]);
      setUpState(m[1] === APP_VERSION ? (silent ? "idle" : "current") : "available");
    } catch(e) { if (!silent) setUpState("error"); }
  };
  useEffect(() => { checkUpdate(true); }, []);
  useEffect(() => {
    const h = (e) => {
      if (!(e.metaKey || e.ctrlKey) || e.key.toLowerCase() !== "z") return;
      const el = document.activeElement;
      if (el && /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)) return;
      e.preventDefault();
      e.shiftKey ? redo() : undo();
    };
    window.addEventListener("keydown", h);
    return () => window.removeEventListener("keydown", h);
  });
  const doUpdate = () => { location.href = location.pathname.split("?")[0] + "?v=" + Date.now(); };

  /* obchody */
  const emptyTrade = () => ({ id:uid(), date: isCurrentWeek ? todayISO() : monday, pair:"", smer:"", pozn:"", sl:"", rr:null, spustene:null, vysledok:null, pnl:"" });
  const startNew = () => setWizard({ editing:false, trade: emptyTrade() });
  const startEdit = (t) => setWizard({ editing:true, confirmDel:false, trade: { ...t,
    smer: (t.pozn==="L"||t.pozn==="S") ? t.pozn : (t.pozn||"").startsWith("L ")?"L":(t.pozn||"").startsWith("S ")?"S":"",
    pozn: (t.pozn==="L"||t.pozn==="S") ? "" : (t.pozn||"").replace(/^[LS] /,""),
    sl: t.sl==null?"":String(t.sl).replace(".",","),
    pnl: t.pnl==null?"":String(t.pnl).replace(".",",") } });
  const upd = (patch) => setWizard(w => ({ ...w, trade: { ...w.trade, ...patch } }));
  const saveTrade = () => {
    const f = wizard.trade;
    const pozn = [f.smer, f.pozn.trim()].filter(Boolean).join(" ");
    const t = { id:f.id, date:f.date, pair:(f.pair||"").trim(), pozn,
      sl: num(f.sl), rr: f.rr ?? null, spustene: f.spustene,
      vysledok: f.spustene===1 ? f.vysledok : null,
      pnl: f.spustene===1 ? num(f.pnl) : null };
    const exists = state.trades.some(x => x.id === t.id);
    persist({ ...state, trades: exists ? state.trades.map(x => x.id===t.id?t:x) : [...state.trades, t] });
    setMonday(mondayOf(t.date));
    setWizard(null);
  };
  const deleteTrade = (id) => { persist({ ...state, trades: state.trades.filter(t => t.id !== id) }); setWizard(null); };

  /* import / export */
  const onImportFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const { next, added, dup } = importCSV(String(r.result), state);
        persist(next);
        setImportMsg(`Naimportovaných ${added} riadkov${dup?` (${dup} duplicít preskočených)`:""}.`);
      } catch(err) { setImportMsg("Import zlyhal — skontroluj formát súboru."); }
    };
    r.readAsText(f, "utf-8");
    e.target.value = "";
  };
  const copyCSV = async (setter) => {
    try { await navigator.clipboard.writeText(csvText); setter(true); setTimeout(()=>setter(false),1500); }
    catch(e){ if (csvRef.current){ csvRef.current.select(); document.execCommand && document.execCommand("copy"); setter(true); setTimeout(()=>setter(false),1500); } }
  };
  const downloadCSV = () => {
    const blob = new Blob(["\ufeff"+csvText], { type:"text/csv;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = `mb-journal-${todayISO()}.csv`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 2000);
  };

  const smerOf = (t) => { const m = (t.pozn||"").match(/^([LS])( |$)/); return m ? m[1] : null; };
  const poznText = (t) => (t.pozn||"").replace(/^[LS]( |$)/,"").trim();

  /* ---------- formulár obchodu ---------- */
  const renderWizard = () => {
    const f = wizard.trade;
    const ok = f.pair.trim() && f.date;
    return (
      <div className="fade-anim" style={{ position:"fixed", inset:0, zIndex:50, display:"flex", flexDirection:"column",
        background:"rgba(18,18,18,0.93)", backdropFilter:"blur(26px)", WebkitBackdropFilter:"blur(26px)" }}>
        <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"max(16px, env(safe-area-inset-top)) 20px 12px" }}>
          <button onClick={()=>setWizard(null)} style={{ color:P.dim, fontFamily:SANS, fontSize:16 }}>Zrušiť</button>
          <div style={{ color:P.text, fontWeight:650, fontFamily:SANS, fontSize:16 }}>{wizard.editing?"Upraviť obchod":"Nový obchod"}</div>
          {wizard.editing ? (
            wizard.confirmDel
              ? <button onClick={()=>deleteTrade(f.id)} style={{ color:"#fff", background:P.loss, fontFamily:SANS, fontSize:14, fontWeight:700, padding:"7px 13px", borderRadius:11 }}>Naozaj?</button>

        </div>
        <div style={{ flex:1, overflowY:"auto", padding:"8px 20px 20px", fontFamily:SANS }}>

          <Field label="Nástroj">

          </Field>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:14 }}>
            <Field label="Smer">
              <Chip big active={f.smer==="L"} onClick={()=>upd({smer: f.smer==="L"?"":"L"})}>▲ L</Chip>
              <Chip big active={f.smer==="S"} tone="loss" onClick={()=>upd({smer: f.smer==="S"?"":"S"})}>▼ S</Chip>
            </Field>
            <Field label="SL — risk na obchod (€)">
              <Input value={f.sl} onChange={e=>upd({sl:e.target.value})} mono inputMode="decimal" placeholder="napr. 250" />

          </div>

          {f.spustene===1 && (

              </Field>
              {f.vysledok!==null && (

                    <div style={{ fontSize:14, color:P.faint, fontFamily:MONO, marginTop:8, display:"flex", gap:14, flexWrap:"wrap" }}>
                      {ws.startBal>0 && <span>= {fmtPct(num(f.pnl)/ws.startBal)} z účtu</span>}
                      {num(f.sl)>0 && num(f.pnl)>0 &&
                        <span style={{ color:P.ice, fontWeight:700 }}>RR {fmtRR(Math.round((num(f.pnl)/num(f.sl))*100)/100)}</span>}
                      {num(f.sl)>0 && num(f.pnl)<=0 && <span>RR sa píše len pri zisku</span>}
                    </div>
                  )}
                </Field>
              )}
            </React.Fragment>
          )}
        </div>
        <div style={{ display:"flex", gap:12, padding:"14px 20px max(20px, env(safe-area-inset-bottom))" }}>
          <button onClick={()=>setWizard(null)} className="jpress" style={{ ...glass(), flex:1, padding:"16px 0", borderRadius:15, color:P.dim, fontSize:17, fontFamily:SANS }}>Zrušiť</button>
          <button onClick={()=>ok&&saveTrade()} className="jpress" style={{ flex:1.4, padding:"16px 0", borderRadius:15,
            background: ok?GRAD:P.slate, color:"#fff", fontSize:17, fontWeight:700, fontFamily:SANS, opacity:ok?1:0.5,
            boxShadow: ok?"0 8px 22px rgba(0,121,152,0.35)":"none" }}>
            {wizard.editing?"Uložiť zmeny":"Zapísať"}
          </button>
        </div>
      </div>
    );
  };

  /* ---------- zostatok ---------- */
  const renderBalEdit = () => {

  /* ---------- týždenné štatistiky ---------- */
  const renderWeek = () => {

    const days = [0,1,2,3,4].map(i => {  // len Po–Pi
      const d = addDays(monday, i);
      const list = ws.trades.filter(t => t.date === d);

    const maxAbs = Math.max(1, ...days.map(x => Math.abs(x.sum)));
    return (

            <div style={{ fontSize:52, fontWeight:200, fontFamily:SANS, letterSpacing:"-0.03em", marginTop:10,
              color: (ws.weekPct??0)>=0?P.ice:P.loss,

              {ws.weekPct==null?"—":fmtPct(ws.weekPct)}
            </div>
            <div style={{ fontSize:17, fontFamily:MONO, color:P.dim, marginTop:10 }}>
              <span style={{ color: ws.sum>=0?P.win:P.loss }}>{fmt$(ws.sum, true)}</span>
              <span style={{ color:P.faint }}> → </span>{fmt$(ws.endBal)}
              <span style={{ color:P.faint }}> · </span>
              <span style={{ color:(ws.fromStartPct??0)>=0?P.win:P.loss }}>{fmtPct(ws.fromStartPct,1)} od štartu</span>
            </div>
          </div>
          {/* denné P/L */}
          <div className="rise" style={{ "--i":1, ...glass(), borderRadius:18, padding:"18px 16px 12px", marginBottom:12 }}>

            <div style={{ display:"flex", alignItems:"stretch", gap:14, height:236, width:"100%" }}>
              {days.map((x,i) => {
                const h = Math.abs(x.sum)/maxAbs * 76;
                const pct = ws.startBal ? x.sum/ws.startBal : null;
                return (
                  <div key={x.d} style={{ flex:1, display:"flex", flexDirection:"column", alignItems:"center", minWidth:0 }}>
                    <div style={{ fontSize:18, fontFamily:MONO, fontWeight:800, whiteSpace:"nowrap",
                      color: x.n===0?P.faint : x.sum>=0?"#4FC3DF":P.loss, marginBottom:8 }}>

                    <div style={{ flex:1, width:"100%", maxWidth:120, display:"flex", flexDirection:"column" }}>
                      <div style={{ height:84, display:"flex", flexDirection:"column", justifyContent:"flex-end" }}>
                        {x.sum>0 && <div className="bar-grow" style={{ "--i":i, height:Math.max(6,h), borderRadius:"8px 8px 0 0",

                      </div>
                      <div style={{ height:1.5, background:"rgba(255,255,255,0.16)" }} />
                      <div style={{ height:84, display:"flex", flexDirection:"column", justifyContent:"flex-start" }}>
                        {x.sum<0 && <div className="bar-grow" style={{ "--i":i, height:Math.max(6,h), borderRadius:"0 0 8px 8px", background:P.loss }} />}
                      </div>
                    </div>
                    <div style={{ fontSize:16, fontFamily:SANS, fontWeight:650, color:P.dim, marginTop:9, whiteSpace:"nowrap" }}>{DAYS_SK[i]} {shortD(x.d)}</div>
                    <div style={{ fontSize:15.5, fontFamily:MONO, fontWeight:750, whiteSpace:"nowrap", marginTop:2,

          </div>
        </div>
      </div>
    );
  };

  /* ---------- import / export ---------- */
  const renderIO = () => (
    <div className="fade-anim" style={{ position:"fixed", inset:0, zIndex:50, display:"flex", flexDirection:"column",

          <button onClick={downloadCSV} className="jpress" style={{ flex:1, padding:"16px 0", borderRadius:15, background:GRAD, color:"#fff", fontSize:16, fontWeight:700, boxShadow:"0 8px 22px rgba(0,121,152,0.35)" }}>Stiahnuť</button>
          <button onClick={()=>copyCSV(setCopied)} className="jpress" style={{ ...glass(), flex:1, padding:"16px 0", borderRadius:15, color:P.text, fontSize:16 }}>{copied?"Skopírované ✓":"Kopírovať"}</button>
          <button onClick={()=>fileRef.current&&fileRef.current.click()} className="jpress" style={{ ...glass(), flex:1, padding:"16px 0", borderRadius:15, color:P.text, fontSize:16 }}>Import</button>
        </div>
        <input ref={fileRef} type="file" accept=".csv,text/csv,text/plain" onChange={onImportFile} style={{ display:"none" }} />
        {importMsg && <div style={{ marginTop:12, fontSize:15, color:P.ice }}>{importMsg}</div>}
      </div>
    </div>
  );

  /* ---------- tabuľka týždňa — ako Numbers ---------- */
  const HeadCell = ({ children, right, center, sep }) => (
    <div style={{ fontSize:12.5, fontWeight:700, textTransform:"uppercase", letterSpacing:"0.08em",
      color:P.faint, fontFamily:SANS, textAlign: center?"center":right?"right":"left", padding:"0 2px",
      whiteSpace:"nowrap", ...(sep?SEP:{}) }}>{children}</div>
  );

  const renderTable = () => {
    let lastDate = null;
    return (
      <div style={{ overflowX:"auto", WebkitOverflowScrolling:"touch", margin:"0 -16px", padding:"0 16px" }}>
        <div style={{ minWidth: GRID_MIN }}>
          {/* hlavička stĺpcov — ako riadok 6 v tabuľke */}
          <div className="thead" style={{ display:"grid", gridTemplateColumns:GRID, gap:8, alignItems:"center",
            padding:"12px 12px 11px", borderBottom:`2px solid rgba(0,121,152,0.55)` }}>
            <HeadCell>Dátum</HeadCell><HeadCell>Nástroj</HeadCell><HeadCell center sep>Spustené</HeadCell><HeadCell center sep>Výsledok</HeadCell>
            <HeadCell center sep>Smer</HeadCell><HeadCell right>Poznámka</HeadCell><HeadCell right>SL</HeadCell><HeadCell right>RR</HeadCell><HeadCell right>Zisk / Strata</HeadCell><HeadCell right>%</HeadCell>
          </div>

          {ws.trades.length === 0 && (
            <div className="rise" style={{ "--i":3, padding:"48px 12px", textAlign:"center", color:P.faint, fontSize:16, fontFamily:SANS }}>
              Tento týždeň zatiaľ bez záznamov. Pridaj obchod cez +.
            </div>
          )}

          {ws.trades.map((t, i) => {
            const newDay = t.date !== lastDate; lastDate = t.date;
            const sm = smerOf(t);
            const pct = t.pnl != null && ws.startBal > 0 ? t.pnl / ws.startBal : null;
            const rowBg = t.spustene===0 ? "rgba(99,99,99,0.10)"
              : t.vysledok===1 ? P.winTint
              : t.vysledok===0 ? P.lossTint
              : t.spustene===1 ? P.goldTint
              : "rgba(184,247,255,0.03)";
            return (
              <div key={t.id} onClick={()=>startEdit(t)} className={`trow ${i<14?"rise":""}`} style={{ "--i":Math.min(3+i,10),
                display:"grid", gridTemplateColumns:GRID, gap:8, alignItems:"center",
                padding:"13px 12px", cursor:"pointer",
                background: rowBg,
                borderTop: newDay && i>0 ? `2px solid rgba(255,255,255,0.10)` : `1px solid rgba(255,255,255,0.045)`,
                opacity: t.spustene===0 ? 0.6 : 1 }}>
                {/* Dátum */}
                <div style={{ fontFamily:MONO, fontSize:15.5, color:P.dim }}>{shortD(t.date)}</div>
                {/* Nástroj */}
                <div style={{ fontFamily:MONO, fontSize:17, fontWeight:750, color:P.text }}>{t.pair||"—"}</div>
                {/* Spustené — prázdne sa berie ako 0 */}
                <div style={{ ...SEP, fontFamily:MONO, fontSize:18, textAlign:"center", whiteSpace:"nowrap", color: t.spustene===1?P.text:P.faint }}>
                  {t.spustene==null?0:t.spustene}
                </div>
                {/* Výsledok */}
                <div style={{ ...SEP, fontFamily:MONO, fontSize:18, fontWeight:800, textAlign:"center", whiteSpace:"nowrap",
                  color: t.vysledok===1?P.win:t.vysledok===0?P.loss:P.faint }}>
                  {t.vysledok==null ? (t.spustene===1?"…":"") : t.vysledok}
                </div>
                {/* Smer */}
                <div style={{ ...SEP, fontFamily:MONO, fontSize:17, fontWeight:800, textAlign:"center", whiteSpace:"nowrap",
                  color: sm==="L"?P.win:sm==="S"?P.loss:P.faint }}>
                  {sm ? (sm==="L"?"▲ L":"▼ S") : ""}
                </div>
                {/* Poznámka — doprava k číslam, dlhá sa zalomí a riadok narastie */}
                <div style={{ fontSize:16, color:P.dim, fontFamily:SANS, textAlign:"right",
                  whiteSpace:"normal", overflowWrap:"anywhere", lineHeight:1.35 }}>
                  {poznText(t)}
                </div>
                {/* SL */}
                <div style={{ fontFamily:MONO, fontSize:16, textAlign:"right", whiteSpace:"nowrap", color:P.faint }}>
                  {t.sl==null?"":t.sl.toLocaleString("sk-SK",{maximumFractionDigits:2})}
                </div>
                {/* RR — dopočítané zo zisku a SL */}
                <div style={{ fontFamily:MONO, fontSize:16, textAlign:"right", whiteSpace:"nowrap",
                  color: rrOf(t)!=null && t.pnl>0 ? P.ice : P.dim }}>{fmtRR(rrOf(t))}</div>
                {/* Zisk/Strata */}
                <div style={{ fontFamily:MONO, fontSize:17, fontWeight:800, textAlign:"right",
                  color: t.pnl==null?P.faint : t.pnl<0?P.loss : t.pnl>0?P.ice : P.dim,
                  textShadow: t.pnl>0?"0 0 12px rgba(184,247,255,0.4)":"none" }}>
                  {t.pnl==null?"":fmt$(t.pnl)}
                </div>
                {/* % */}
                <div style={{ fontFamily:MONO, fontSize:15.5, fontWeight:700, textAlign:"right",
                  color: pct==null?P.faint : pct<0?P.loss : P.win }}>
                  {pct==null?"":fmtPct(pct,1)}
                </div>
              </div>
            );
          })}

          {/* súčtové riadky — presne ako riadky 31 a 32 v tabuľke, zarovnané pod stĺpcami */}
          {ws.trades.length > 0 && (
            <React.Fragment>
              <div className="rise" style={{ "--i":10, display:"grid", gridTemplateColumns:GRID, gap:8, alignItems:"center",
                padding:"15px 12px 12px", borderTop:`2px solid rgba(0,121,152,0.55)`, marginTop:2 }}>
                <div style={{ gridColumn:"1 / span 2", fontSize:17, fontWeight:800, color:P.text, fontFamily:SANS }}>Úspešnosť</div>
                <div style={{ fontFamily:MONO, fontSize:16.5, fontWeight:800, textAlign:"center", whiteSpace:"nowrap", color:P.text }}>{ws.firedPct==null?"—":fmtPct(ws.firedPct,1,false)}</div>
                <div style={{ fontFamily:MONO, fontSize:16.5, fontWeight:800, textAlign:"center", whiteSpace:"nowrap", color:(ws.winRate??0)>=0.5?P.win:P.loss }}>{ws.winRate==null?"—":fmtPct(ws.winRate,1,false)}</div>
                <div style={{ gridColumn:"span 2" }}></div>
                <div style={{ fontFamily:MONO, fontSize:16.5, fontWeight:800, textAlign:"right", whiteSpace:"nowrap", color:P.dim }}>{ws.avgRR==null?"—":fmtRR(ws.avgRR)}</div>
                <div style={{ fontFamily:MONO, fontSize:17, fontWeight:800, textAlign:"right", whiteSpace:"nowrap", color: ws.sum>=0?P.ice:P.loss,
                  textShadow: ws.sum>0?"0 0 12px rgba(184,247,255,0.4)":"none" }}>{fmt$(ws.sum, true)}</div>
                <div style={{ fontFamily:MONO, fontSize:15.5, fontWeight:800, textAlign:"right", whiteSpace:"nowrap", color: (ws.weekPct??0)>=0?P.win:P.loss }}>{fmtPct(ws.weekPct,1)}</div>
              </div>
              <div className="rise" style={{ "--i":11, display:"grid", gridTemplateColumns:GRID, gap:8, alignItems:"center", padding:"4px 12px 14px" }}>
                <div style={{ gridColumn:"1 / span 7", fontSize:14, color:P.faint, fontFamily:SANS }}>Koniec týždňa · od štartu účtu →</div>
                <div style={{ fontFamily:MONO, fontSize:17, fontWeight:800, textAlign:"right", color:P.text }}>{fmt$(ws.endBal)}</div>
                <div style={{ fontFamily:MONO, fontSize:15.5, fontWeight:800, textAlign:"right", color:(ws.fromStartPct??0)>=0?P.win:P.loss }}>{fmtPct(ws.fromStartPct,1)}</div>
              </div>
            </React.Fragment>
          )}
        </div>
      </div>
    );
  };

  return (
    <div>
      <Background />
      <div className="scrollpane" style={{ paddingBottom:190, fontFamily:SANS }}>
        {/* hlavička */}
        <div style={{ padding:"max(24px, env(safe-area-inset-top)) 16px 10px" }}>
          <div className="rise" style={{ "--i":0, display:"flex", alignItems:"center", justifyContent:"space-between" }}>
            <div style={{ fontSize:13, textTransform:"uppercase", color:P.faint, letterSpacing:"0.18em" }}>Obchodný denník</div>
            <div style={{ display:"flex", gap:9, alignItems:"center" }}>
              {/* krok späť / dopredu */}
              <div style={{ ...glass(), display:"flex", alignItems:"center", borderRadius:13, height:42, padding:"0 3px" }}>
                <button onClick={undo} disabled={!past.length} className="icobtn" aria-label="Krok späť" title="Krok späť"
                  style={{ width:42, height:36, borderRadius:11, fontSize:20, color: past.length?P.dim:"rgba(219,219,219,0.22)",
                    cursor: past.length?"pointer":"default" }}>↶</button>
                <span style={{ width:1, height:20, background:P.border }} />
                <button onClick={redo} disabled={!future.length} className="icobtn" aria-label="Krok dopredu" title="Krok dopredu"
                  style={{ width:42, height:36, borderRadius:11, fontSize:20, color: future.length?P.dim:"rgba(219,219,219,0.22)",
                    cursor: future.length?"pointer":"default" }}>↷</button>
              </div>
              {upState==="available" ? (
                <button onClick={doUpdate} className="jpress"
                  style={{ padding:"0 16px", height:42, borderRadius:13, background:GRAD, color:"#fff", fontSize:15, fontWeight:750,
                    boxShadow:"0 6px 18px rgba(0,121,152,0.4)" }}>
                  ⤓ Aktualizovať
                </button>
              ) : (
                <button onClick={()=>checkUpdate(false)} className="jpress"
                  style={{ ...glass(), padding:"0 15px", height:42, borderRadius:13, color: upState==="current"?P.ice:P.dim, fontSize:14.5, fontWeight:600 }}>
                  {upState==="checking"?"Kontrolujem…":upState==="current"?"✓ Aktuálna":upState==="error"?"Si online?":"↻ Update"}
                </button>
              )}
              <button onClick={()=>setIoOpen(true)} className="jpress"
                style={{ ...glass(), padding:"0 16px", height:42, borderRadius:13, color:P.dim, fontSize:14.5, fontWeight:650 }}>Údaje</button>
            </div>
          </div>
          {/* týždeň + účet — ako riadky 1-2 v tabuľke */}
          <div className="rise" style={{ "--i":1, marginTop:14 }}>
            <div style={{ display:"flex", alignItems:"baseline", gap:12, flexWrap:"wrap" }}>
              <span style={{ width:5, height:32, borderRadius:3, background:GRAD, flexShrink:0, alignSelf:"center", boxShadow:"0 0 12px rgba(184,247,255,0.35)" }} />
              <h1 style={{ fontSize:32, fontWeight:780, letterSpacing:"-0.02em", fontFamily:SANS,
                background:`linear-gradient(100deg, ${P.text} 35%, ${P.ice} 165%)`, WebkitBackgroundClip:"text", backgroundClip:"text", color:"transparent" }}>
                Týždeň {kt}
              </h1>
              <span style={{ fontSize:16, color:P.faint, fontFamily:MONO }}>{shortD(monday)} – {shortD(addDays(monday,6))}</span>
              {isCurrentWeek && <span style={{ fontSize:12, fontWeight:750, letterSpacing:"0.1em", color:P.ice, border:`1px solid rgba(184,247,255,0.35)`, borderRadius:999, padding:"3px 10px" }}>TERAZ</span>}
            </div>
            <button onClick={()=>setBalEdit({ val: ws.startBal ? String(Math.round(ws.startBal*100)/100).replace(".",",") : "" })}
              className="jpress" style={{ display:"flex", alignItems:"baseline", gap:10, marginTop:10, marginLeft:17, textAlign:"left" }}>
              <span style={{ fontSize:14, color:P.faint, textTransform:"uppercase", letterSpacing:"0.1em" }}>Účet</span>
              <span style={{ fontFamily:MONO, fontSize:22, fontWeight:800, color:P.text }}>{fmt$(ws.startBal)}</span>
              <span style={{ fontSize:13, color: ws.explicit?P.faint:P.ice }}>{ws.explicit ? "zapísaný ✎" : "auto — ťukni a zapíš ✎"}</span>
            </button>
          </div>
          {saveErr && (
            <div style={{ ...glass({border:"1px solid rgba(252,68,34,0.4)"}), marginTop:12, borderRadius:14, padding:"13px 16px", fontSize:15, color:P.loss }}>
              Nepodarilo sa uložiť — sprav si Export ako zálohu.
            </div>
          )}
        </div>

        {/* tabuľka */}
        <div style={{ padding:"4px 16px 0" }}>
          {renderTable()}
          <div style={{ textAlign:"center", fontSize:12.5, color:P.faint, fontFamily:MONO, marginTop:22 }}>v{APP_VERSION} · mb-journal</div>
        </div>
      </div>

      {/* dock — širší, výraznejší */}
      {!wizard && !ioOpen && !totalOpen && !weekOpen && !balEdit && (
        <React.Fragment>
          <div style={{ position:"fixed", left:0, right:0, bottom:0, height:230, zIndex:9, pointerEvents:"none",
            background:"linear-gradient(180deg, rgba(22,22,22,0) 0%, rgba(19,19,19,0.34) 38%, rgba(16,16,16,0.72) 74%, rgba(14,14,14,0.92) 100%)",
            WebkitMaskImage:"linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 34%)", maskImage:"linear-gradient(180deg, rgba(0,0,0,0) 0%, #000 34%)" }} />
          <div style={{ position:"fixed", left:"50%", transform:"translateX(-50%)", bottom:"max(10px, env(safe-area-inset-bottom))", zIndex:10,
            width:"calc(100% - 20px)", maxWidth:760,
            display:"flex", justifyContent:"space-between", alignItems:"center", gap:10, padding:"9px 10px",
            borderRadius:26, background:"rgba(42,42,42,0.78)", backdropFilter:"blur(30px) saturate(160%)", WebkitBackdropFilter:"blur(30px) saturate(160%)",
            border:"1px solid rgba(255,255,255,0.12)", boxShadow:"inset 0 1px 0 rgba(255,255,255,0.10), 0 18px 44px rgba(0,0,0,0.6)" }}>

            {/* prepínanie týždňov */}
            <div style={{ display:"flex", alignItems:"center", gap:2, flex:1, minWidth:0 }}>
              <button onClick={()=>setMonday(addDays(monday,-7))} className="jpress" aria-label="Predchádzajúci týždeň"
                style={{ width:56, height:56, borderRadius:18, color:P.text, fontSize:26, background:"rgba(255,255,255,0.06)" }}>‹</button>
              <button onClick={()=>setMonday(mondayOf(todayISO()))} className="jpress" title="Skoč na aktuálny týždeň"
                style={{ padding:"0 12px", height:56, borderRadius:18, textAlign:"center", minWidth:96 }}>
                <div style={{ fontSize:18, fontWeight:800, color:P.text, fontFamily:SANS }}>KT{kt}</div>
                <div style={{ fontSize:11.5, fontFamily:MONO, color:P.faint }}>{shortD(monday)}–{shortD(addDays(monday,6))}</div>
              </button>
              <button onClick={()=>setMonday(addDays(monday,7))} className="jpress" aria-label="Ďalší týždeň"
                style={{ width:56, height:56, borderRadius:18, color:P.text, fontSize:26, background:"rgba(255,255,255,0.06)" }}>›</button>
            </div>

            {/* týždeň — otvorí týždenné štatistiky */}
            <button onClick={()=>setWeekOpen(true)} className="jpress" aria-label="Týždenné štatistiky"
              style={{ height:56, padding:"0 16px", borderRadius:18, background:"rgba(255,255,255,0.06)",
                border:"1px solid rgba(255,255,255,0.08)" }}>
              <div style={{ fontSize:17, fontWeight:800, fontFamily:MONO, whiteSpace:"nowrap", color:(ws.weekPct??0)>=0?P.ice:P.loss }}>{ws.weekPct==null?"—":fmtPct(ws.weekPct,1)}</div>
              <div style={{ fontSize:10, letterSpacing:"0.14em", textTransform:"uppercase", color:P.faint }}>týždeň</div>
            </button>

            {/* celý účet */}
            <button onClick={()=>setTotalOpen(true)} className="jpress" aria-label="Kumulatívne štatistiky"
              style={{ height:56, padding:"0 16px", borderRadius:18, background:"rgba(255,255,255,0.06)",
                border:"1px solid rgba(255,255,255,0.08)" }}>
              <div style={{ fontSize:17, fontWeight:800, fontFamily:MONO, whiteSpace:"nowrap", color:(tot.fromStart??0)>=0?P.ice:P.loss }}>{fmtPct(tot.fromStart,1)}</div>
              <div style={{ fontSize:10, letterSpacing:"0.14em", textTransform:"uppercase", color:P.faint }}>účet</div>
            </button>

            {/* kopírovať všetko */}
            <button onClick={()=>copyCSV(setDockCopied)} className="jpress" aria-label="Kopírovať všetko do schránky"
              style={{ width:56, height:56, borderRadius:18, fontSize:22,
                background:"rgba(255,255,255,0.06)",
                border:`1px solid ${dockCopied?"rgba(184,247,255,0.55)":"rgba(255,255,255,0.08)"}`,
                color: dockCopied?P.ice:P.dim,
                boxShadow: dockCopied?"0 0 18px rgba(184,247,255,0.28)":"none",
                transition:"color 180ms ease, border-color 180ms ease, box-shadow 220ms ease" }}>
              {dockCopied?"✓":"⧉"}
            </button>

            {/* nový obchod */}
            <button onClick={startNew} className="jpress" aria-label="Pridať obchod"
              style={{ width:62, height:62, borderRadius:"50%", fontSize:32, fontWeight:300, background:GRAD, color:"#fff", flexShrink:0,
                border:"1px solid rgba(184,247,255,0.35)",
                boxShadow:"inset 0 1px 0 rgba(255,255,255,0.35), 0 14px 34px rgba(0,0,0,0.55), 0 0 24px rgba(0,121,152,0.4)" }}>+</button>
          </div>
        </React.Fragment>
      )}

      {toast && (
        <div className="toast" style={{ position:"fixed", left:"50%", bottom:"max(96px, calc(env(safe-area-inset-bottom) + 96px))", zIndex:40,
          background:"rgba(46,46,46,0.94)", border:"1px solid rgba(184,247,255,0.35)", color:P.text,
          padding:"12px 22px", borderRadius:999, fontSize:15, fontWeight:650, fontFamily:SANS,
          backdropFilter:"blur(20px)", WebkitBackdropFilter:"blur(20px)", boxShadow:"0 12px 30px rgba(0,0,0,0.55)" }}>{toast}</div>
      )}

      {wizard && renderWizard()}
      {balEdit && renderBalEdit()}
      {totalOpen && renderTotal()}
      {weekOpen && renderWeek()}
      {ioOpen && renderIO()}
    </div>
  );
};

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
